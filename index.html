<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>シナリオ手帖</title>
<meta name="theme-color" content="#1d6b63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="シナリオ手帖">
<style>
:root{--bg:#edf0f2;--surface:#fff;--ink:#242126;--muted:#6b7177;--line:#d7dde1;--accent:#1d6b63;--soft:#dcebe8;--warn:#b3402f}
@media (prefers-color-scheme:dark){:root{--bg:#16191b;--surface:#202427;--ink:#e9ecee;--muted:#9aa3a9;--line:#343a3e;--accent:#5cb8ab;--soft:#20312f;--warn:#e07a68}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;-webkit-text-size-adjust:100%}
.wrap{min-height:100dvh;display:grid;place-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.card{width:min(520px,100%);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px 24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:48px;height:48px;border-radius:12px}
.brand b{font-size:21px;letter-spacing:.04em}
.brand small{display:block;color:var(--muted);font-size:12px;letter-spacing:.08em}
h1{font-size:17px;margin:4px 0 0}
p{margin:0;line-height:1.75;font-size:14px}
.drop{border:2px dashed color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:16px;padding:26px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;transition:background .15s,border-color .15s}
.drop.over{background:var(--soft);border-color:var(--accent)}
.drop b{font-size:15px}
.drop small{color:var(--muted);font-size:12.5px}
.btn{appearance:none;border:none;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:15px;padding:12px 18px;cursor:pointer}
.btn.sub{background:none;color:var(--accent);border:1px solid var(--line)}
.msg{font-size:13px;min-height:1.2em;color:var(--muted)}
.msg.bad{color:var(--warn)}
.tips{font-size:12.5px;color:var(--muted);line-height:1.7;border-top:1px solid var(--line);padding-top:12px}
.tips b{color:var(--ink)}
.boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);color:var(--muted);font-size:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="boot" id="boot">読み込んでいます…</div>
<div class="wrap" id="setup" hidden>
  <div class="card">
    <div class="brand"><img src="icons/icon-192.png" alt=""><div><b>シナリオ手帖</b><small>TRPG SCENARIO NOTEBOOK</small></div></div>
    <h1 id="ttl">アプリのファイルを入れてください</h1>
    <p id="lead">BOOTHで購入した「シナリオ手帖」のファイル（.html）を、下の枠にドロップするか、「ファイルを選ぶ」から選んでください。一度入れると、次からはこのページを開くだけで使えます。</p>
    <label class="drop" id="drop">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5"/><path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/></svg>
      <b>ここにファイルをドロップ</b>
      <small>または</small>
      <span class="btn">ファイルを選ぶ</span>
      <input type="file" id="file" accept=".html,text/html" hidden>
    </label>
    <div class="msg" id="msg" role="status"></div>
    <button class="btn sub" id="back" type="button" hidden>入れ直さずに戻る</button>
    <div class="tips"><b>ホーム画面に追加</b>しておくと、アプリのように開けて、書いたものも消えにくくなります。<br>iPhone・iPad：共有ボタン →「ホーム画面に追加」／Android・パソコン：アドレスバーの「インストール」</div>
  </div>
</div>
<script>
(function () {
  var MARK = /<!--\s*scenario-techo-app\s+v([\d.]+)\s*-->/;
  var $ = function (id) { return document.getElementById(id); };
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  function db() {
    return new Promise(function (res, rej) {
      var r = indexedDB.open('scenario-techo-launch', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('app'); };
      r.onsuccess = function () { res(r.result); }; r.onerror = function () { rej(r.error); };
    });
  }
  function getApp() { return db().then(function (d) { return new Promise(function (res, rej) { var q = d.transaction('app').objectStore('app').get('html'); q.onsuccess = function () { res(q.result || null); }; q.onerror = function () { rej(q.error); }; }); }); }
  function putApp(rec) { return db().then(function (d) { return new Promise(function (res, rej) { var tx = d.transaction('app', 'readwrite'); tx.objectStore('app').put(rec, 'html'); tx.oncomplete = function () { res(); }; tx.onerror = function () { rej(tx.error); }; }); }); }
  function boot(html) { document.open(); document.write(html); document.close(); }
  function setup(cur) {
    $('boot').hidden = true; $('setup').hidden = false;
    if (cur) {
      $('ttl').textContent = '新しい版のファイルを入れてください';
      $('lead').textContent = '新しい版の「シナリオ手帖」のファイル（.html）を入れると、アプリが新しくなります。書いたシナリオはそのまま残ります。（今の版：' + cur.ver + '）';
      $('back').hidden = false;
      $('back').onclick = function () { location.replace(location.pathname); };
    }
  }
  function take(file) {
    var msg = $('msg'); msg.className = 'msg'; msg.textContent = '読み込んでいます…';
    if (!file) { msg.textContent = ''; return; }
    file.text().then(function (t) {
      var m = MARK.exec(t);
      if (!m) { msg.className = 'msg bad'; msg.textContent = 'シナリオ手帖のファイルではないようです。BOOTHからダウンロードした .html ファイルを選んでください。'; return; }
      return putApp({ html: t, ver: m[1], at: Date.now() }).then(function () {
        msg.textContent = '入れました（版 ' + m[1] + '）。開いています…';
        setTimeout(function () { location.replace(location.pathname); }, 400);
      });
    }).catch(function () { msg.className = 'msg bad'; msg.textContent = 'ファイルを読み込めませんでした。もう一度お試しください。'; });
  }
  var drop = $('drop'), fi = $('file');
  fi.addEventListener('change', function () { take(fi.files[0]); fi.value = ''; });
  ['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
  ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
  drop.addEventListener('drop', function (e) { var f = e.dataTransfer && e.dataTransfer.files[0]; take(f); });
  var wantUpdate = /[?&]update\b/.test(location.search);
  getApp().then(function (rec) {
    if (rec && rec.html && !wantUpdate) boot(rec.html);
    else setup(wantUpdate ? rec : null);
  }).catch(function () { setup(null); $('msg').className = 'msg bad'; $('msg').textContent = 'このブラウザでは保存の仕組みが使えないようです（プライベートブラウズでは使えません）。'; });
})();
</script>
</body>
</html>
